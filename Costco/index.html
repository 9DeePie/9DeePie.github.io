<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth fade and pop animation for the top video slot */
    #video-wrapper {
      opacity: 0;
      transform: scale(0.95);
      visibility: hidden;
      transition: opacity 0.35s ease-in-out, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
    }

    #video-wrapper.show {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
    }

    /* Zoom in and adjust vertical offset to crop top black bar (-16%) */
    .crop-top-video {
      width: 100%;
      height: 180%;
      transform: translateY(-16%);
      pointer-events: none; /* Prevents touch interference on iframe */
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-start p-4 pt-6 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center gap-6">

    <!-- Reserved Top Slot (Keeps buttons locked in place so they never move) -->
    <div class="w-full aspect-square relative">
      <div id="video-wrapper" class="absolute inset-0 w-full h-full rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black z-20">
        <iframe 
          id="costcoVideo"
          class="crop-top-video"
          src="https://www.youtube.com/embed/f4WPnYh1AKk?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1" 
          title="Welcome to Costco" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <!-- Clickable Box (Anchored firmly in place) -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

  </div>

  <script>
    let player;
    let isApiReady = false;
    let hasTriggered = false;
    let timeCheckInterval = null;
    const videoWrapper = document.getElementById('video-wrapper');

    // Load YouTube iframe API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('costcoVideo', {
        events: {
          'onReady': () => { isApiReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      // When video starts playing (State 1)
      if (event.data === YT.PlayerState.PLAYING) {
        // Start checking playback time to hide 1 second early
        if (!timeCheckInterval) {
          timeCheckInterval = setInterval(() => {
            if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
              const currentTime = player.getCurrentTime();
              const duration = player.getDuration();
              
              // If we are within 1 second of the end, hide early
              if (duration > 0 && currentTime >= duration - 1.0) {
                videoWrapper.classList.remove('show');
                clearInterval(timeCheckInterval);
                timeCheckInterval = null;
              }
            }
          }, 200); // Check every 200ms
        }
      } 
      // Fallback: clear interval if video pauses or ends naturally
      else if (event.data === YT.PlayerState.ENDED || event.data === YT.PlayerState.PAUSED) {
        if (timeCheckInterval) {
          clearInterval(timeCheckInterval);
          timeCheckInterval = null;
        }
        if (event.data === YT.PlayerState.ENDED) {
          videoWrapper.classList.remove('show');
        }
      }
    }

    function triggerVideo() {
      if (hasTriggered) return;
      hasTriggered = true;

      // Reveal wrapper at the top
      videoWrapper.classList.add('show');

      // Play video with audio
      if (player && typeof player.playVideo === 'function') {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }

      // Cleanup listeners
      window.removeEventListener('pointerdown', triggerVideo);
      window.removeEventListener('click', triggerVideo);
    }

    // Capture first touch or click anywhere
    window.addEventListener('pointerdown', triggerVideo, { once: true });
    window.addEventListener('click', triggerVideo, { once: true });

    // Inject YouTube Iframe API Script
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>

</body>
</html>
