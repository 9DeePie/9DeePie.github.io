<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth expand/collapse animation for the video container */
    #video-wrapper {
      max-height: 0px;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease-in-out, margin 0.3s ease-in-out, visibility 0.3s;
      margin-bottom: 0px;
    }

    #video-wrapper.show {
      max-height: 384px; /* Matches max-w-sm square height */
      opacity: 1;
      visibility: visible;
      margin-bottom: 1.5rem;
    }

    /* Zoom in and adjust vertical offset to crop top black bar (-16%) */
    .crop-top-video {
      width: 100%;
      height: 180%;
      transform: translateY(-16%);
      pointer-events: none; /* Prevents touch interference on iframe */
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-start p-4 pt-6 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center gap-6 pb-8">

    <!-- Big Costco Header -->
    <h1 class="text-6xl font-black text-white tracking-widest uppercase select-none text-center">
      Costco
    </h1>

    <!-- Square Video Container (Initially hidden, expands on interaction) -->
    <div id="video-wrapper" class="w-full aspect-square rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black relative">
      <iframe 
        id="costcoVideo"
        class="crop-top-video"
        src="https://www.youtube.com/embed/f4WPnYh1AKk?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1" 
        title="Welcome to Costco" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>
    </div>

    <!-- Primary Button: Wallet ID Badge -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

    <!-- Additional Buttons (Button 2 to Button 6) -->
    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 2
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 3
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 4
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 5
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 6
      </h2>
    </a>

  </div>

  <script>
    let player;
    let isApiReady = false;
    let hasTriggered = false;
    let timeCheckInterval = null;
    const videoWrapper = document.getElementById('video-wrapper');

    // Load YouTube iframe API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('costcoVideo', {
        events: {
          'onReady': () => { isApiReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      // When video starts playing (State 1)
      if (event.data === YT.PlayerState.PLAYING) {
        // Start checking playback time to hide 0.5 seconds early
        if (!timeCheckInterval) {
          timeCheckInterval = setInterval(() => {
            if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
              const currentTime = player.getCurrentTime();
              const duration = player.getDuration();
              
              // If we are within 0.5 seconds of the end, hide early
              if (duration > 0 && currentTime >= duration - 0.5) {
                videoWrapper.classList.remove('show');
                clearInterval(timeCheckInterval);
                timeCheckInterval = null;
              }
            }
          }, 100); // Check every 100ms for high precision
        }
      } 
      // Fallback: clear interval if video pauses or ends naturally
      else if (event.data === YT.PlayerState.ENDED || event.data === YT.PlayerState.PAUSED) {
        if (timeCheckInterval) {
          clearInterval(timeCheckInterval);
          timeCheckInterval = null;
        }
        if (event.data === YT.PlayerState.ENDED) {
          videoWrapper.classList.remove('show');
        }
      }
    }

    function triggerVideo() {
      if (hasTriggered) return;
      hasTriggered = true;

      // Reveal wrapper
      videoWrapper.classList.add('show');

      // Play video with audio
      if (player && typeof player.playVideo === 'function') {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }

      // Cleanup all interaction listeners
      window.removeEventListener('pointerdown', triggerVideo);
      window.removeEventListener('touchstart', triggerVideo);
      window.removeEventListener('touchmove', triggerVideo);
      window.removeEventListener('click', triggerVideo);
      window.removeEventListener('scroll', triggerVideo);
    }

    // Capture user gesture events (pointerdown, touchstart, touchmove handle mobile touch & scroll gestures cleanly)
    window.addEventListener('pointerdown', triggerVideo, { once: true });
    window.addEventListener('touchstart', triggerVideo, { once: true });
    window.addEventListener('touchmove', triggerVideo, { once: true });
    window.addEventListener('click', triggerVideo, { once: true });
    window.addEventListener('scroll', triggerVideo, { once: true });

    // Inject YouTube Iframe API Script
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>

</body>
</html>
