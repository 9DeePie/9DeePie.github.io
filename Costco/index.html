<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth fade and pop animation for the top video slot */
    #video-wrapper {
      opacity: 0;
      transform: scale(0.95);
      visibility: hidden;
      transition: opacity 0.35s ease-in-out, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
    }

    #video-wrapper.show {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
    }

    /* Zoom in and adjust vertical offset to crop top black bar (-16%) */
    .crop-top-video {
      width: 100%;
      height: 180%;
      transform: translateY(-16%);
      pointer-events: none; /* Prevents touch interference on iframe */
    }

    /* Temporarily block clicks while loading */
    .loading-lock {
      pointer-events: none;
      opacity: 0.8;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-start p-4 pt-6 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center gap-6 pb-8">

    <!-- Interactive Top Video Box (Locked for 1 second on load to prevent black-screen glitch) -->
    <div id="video-container" class="w-full aspect-square relative rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black flex items-center justify-center cursor-pointer select-none loading-lock transition-opacity duration-300">
      
      <!-- Big Costco Text (Visible initially and when video finishes) -->
      <h1 class="text-6xl font-black text-white tracking-widest uppercase z-10">
        Costco
      </h1>

      <!-- Video Overlay Wrapper (Plays on top of the text when tapped) -->
      <div id="video-wrapper" class="absolute inset-0 w-full h-full bg-black z-20">
        <iframe 
          id="costcoVideo"
          class="crop-top-video"
          src="https://www.youtube.com/embed/f4WPnYh1AKk?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1" 
          title="Welcome to Costco" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <!-- Primary Button: Wallet ID Badge -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

    <!-- Additional Buttons (Button 2 to Button 6) -->
    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 2
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 3
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 4
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 5
      </h2>
    </a>

    <a 
      href="#" 
      class="w-full bg-black border border-white p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Button 6
      </h2>
    </a>

  </div>

  <script>
    let player;
    let isApiReady = false;
    let timeCheckInterval = null;
    const videoContainer = document.getElementById('video-container');
    const videoWrapper = document.getElementById('video-wrapper');

    // Unlock the container after 1 second to allow the YouTube iframe to fully initialize
    setTimeout(() => {
      videoContainer.classList.remove('loading-lock');
    }, 1000);

    // Load YouTube iframe API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('costcoVideo', {
        events: {
          'onReady': () => { isApiReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timeCheckInterval) {
          timeCheckInterval = setInterval(() => {
            if (player && typeof player.getCurrentTime === 'function' && typeof player.getDuration === 'function') {
              const currentTime = player.getCurrentTime();
              const duration = player.getDuration();
              
              // Hide 0.5 seconds early
              if (duration > 0 && currentTime >= duration - 0.5) {
                videoWrapper.classList.remove('show');
                clearInterval(timeCheckInterval);
                timeCheckInterval = null;
              }
            }
          }, 100);
        }
      } 
      else if (event.data === YT.PlayerState.ENDED || event.data === YT.PlayerState.PAUSED) {
        if (timeCheckInterval) {
          clearInterval(timeCheckInterval);
          timeCheckInterval = null;
        }
        if (event.data === YT.PlayerState.ENDED) {
          videoWrapper.classList.remove('show');
        }
      }
    }

    function triggerVideo() {
      // Prevent re-triggering if already showing/playing or still locked
      if (videoContainer.classList.contains('loading-lock') || videoWrapper.classList.contains('show')) return;

      videoWrapper.classList.add('show');

      if (player && typeof player.playVideo === 'function') {
        player.unMute();
        player.setVolume(100);
        player.seekTo(0);
        player.playVideo();
      }
    }

    // Attach click listener to the video container box
    videoContainer.addEventListener('click', triggerVideo);

    // Inject YouTube Iframe API Script
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>

</body>
</html>
