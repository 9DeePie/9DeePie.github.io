<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-center p-4 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center gap-6">

    <!-- Minimalist Video Player (No Titles, Logos, or Controls) -->
    <div class="w-full aspect-[9/16] max-h-[60vh] rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black">
      <iframe 
        class="w-full h-full"
        src="https://www.youtube.com/embed/f4WPnYh1AKk?controls=0&rel=0&modestbranding=1&showinfo=0&iv_load_policy=3" 
        title="Surprise Video" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>
    </div>

    <!-- Clickable Box -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

  </div>

</body>
</html>
