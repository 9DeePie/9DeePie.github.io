<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth expand/collapse animation for the video container */
    #video-wrapper {
      max-height: 0px;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease-in-out, margin 0.3s ease-in-out;
      margin-bottom: 0px;
    }

    #video-wrapper.show {
      max-height: 60vh;
      opacity: 1;
      margin-bottom: 1.5rem; /* space-y equivalent */
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-center p-4 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center">

    <!-- Pop-up Video Container (Initially hidden and collapsed) -->
    <div id="video-wrapper" class="w-full aspect-[9/16] rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black">
      <iframe 
        id="costcoVideo"
        class="w-full h-full"
        src="https://www.youtube.com/embed/f4WPnYh1AKk?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3" 
        title="Welcome to Costco" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>
    </div>

    <!-- Clickable Box -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

  </div>

  <script>
    let player;
    let hasTriggered = false;
    const videoWrapper = document.getElementById('video-wrapper');

    // Load YouTube iframe API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('costcoVideo', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Monitor video state: hide container when it finishes playing
    function onPlayerStateChange(event) {
      // YT.PlayerState.ENDED is 0
      if (event.data === YT.PlayerState.ENDED) {
        videoWrapper.classList.remove('show');
      }
    }

    // Triggered on the very first tap anywhere on the page
    function handleFirstTap(e) {
      if (hasTriggered) return;
      hasTriggered = true;

      // 1. Pop up / expand the video container
      videoWrapper.classList.add('show');

      // 2. Play video with sound
      if (player && player.playVideo) {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }

      // Remove global listeners so subsequent taps behave normally (e.g. clicking the link)
      window.removeEventListener('click', handleFirstTap);
      window.removeEventListener('touchstart', handleFirstTap);
    }

    // Listen for the first tap anywhere on the entire page
    window.addEventListener('click', handleFirstTap);
    window.addEventListener('touchstart', handleFirstTap);

    // Inject YouTube Iframe API Script dynamically
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>

</body>
</html>
