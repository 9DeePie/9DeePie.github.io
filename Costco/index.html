  <style>
    /* Expand/collapse animation for the square container */
    #video-wrapper {
      max-height: 0px;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease-in-out, margin 0.3s ease-in-out;
      margin-bottom: 0px;
    }

    #video-wrapper.show {
      max-height: 384px; /* Matches max-w-sm square height */
      opacity: 1;
      margin-bottom: 1.5rem;
    }

    /* Zoom in and adjust vertical offset to remove top black bars */
    .crop-top-video {
      width: 100%;
      height: 180%;
      transform: translateY(-8%); /* Shifts view down into the video to crop out top black bars */
    }
  </style>
</head>
