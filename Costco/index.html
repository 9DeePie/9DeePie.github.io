<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth expand/collapse animation */
    #video-wrapper {
      max-height: 0px;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease-in-out, margin 0.3s ease-in-out, visibility 0.3s;
      margin-bottom: 0px;
    }

    #video-wrapper.show {
      max-height: 384px;
      opacity: 1;
      visibility: visible;
      margin-bottom: 1.5rem;
    }

    /* Zoom in and adjust vertical offset to crop top black bar */
    .crop-top-video {
      width: 100%;
      height: 180%;
      transform: translateY(-8%);
      pointer-events: none; /* Prevents touch interference on iframe */
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-center p-4 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center">

    <!-- Square Video Container -->
    <div id="video-wrapper" class="w-full aspect-square rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black relative">
      <iframe 
        id="costcoVideo"
        class="crop-top-video"
        src="https://www.youtube.com/embed/f4WPnYh1AKk?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1" 
        title="Welcome to Costco" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>
    </div>

    <!-- Clickable Box -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

  </div>

  <script>
    let player;
    let isApiReady = false;
    let hasTriggered = false;
    const videoWrapper = document.getElementById('video-wrapper');

    // Load YouTube iframe API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('costcoVideo', {
        events: {
          'onReady': () => { isApiReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      // Hide when ended
      if (event.data === YT.PlayerState.ENDED) {
        videoWrapper.classList.remove('show');
      }
    }

    function triggerVideo() {
      if (hasTriggered) return;
      hasTriggered = true;

      // Reveal wrapper
      videoWrapper.classList.add('show');

      // Play video with audio
      if (player && typeof player.playVideo === 'function') {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }

      // Cleanup listeners
      window.removeEventListener('pointerdown', triggerVideo);
      window.removeEventListener('click', triggerVideo);
    }

    // Capture first touch or click anywhere
    window.addEventListener('pointerdown', triggerVideo, { once: true });
    window.addEventListener('click', triggerVideo, { once: true });

    // Inject YouTube Iframe API Script
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>

</body>
</html>
