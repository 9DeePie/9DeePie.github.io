<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-100 min-h-[100dvh] flex flex-col items-center justify-center p-4 overflow-y-auto">

  <div class="w-full max-w-sm flex flex-col items-center gap-6">

    <!-- Video Container with Cover Overlay (Starts playing with full sound on first tap) -->
    <div class="relative w-full aspect-[9/16] max-h-[60vh] rounded-2xl overflow-hidden border border-neutral-800 shadow-lg bg-black">
      
      <!-- YouTube Iframe (Autoplays with sound once cover is tapped) -->
      <iframe 
        id="costcoVideo"
        class="w-full h-full"
        src="https://www.youtube.com/embed/f4WPnYh1AKk?enablejsapi=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3" 
        title="Welcome to Costco" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen
      ></iframe>

      <!-- Invisible tap interceptor / Overlay for the first user tap -->
      <div 
        id="tap-overlay" 
        onclick="startWithSound()"
        class="absolute inset-0 cursor-pointer z-10 bg-transparent flex items-center justify-center"
      ></div>

    </div>

    <!-- Clickable Box -->
    <a 
      href="https://9deepie.github.io/Costco/Wallet/IDBadge" 
      class="w-full bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center hover:border-[#ff0055] transition-all duration-200 shadow-lg active:scale-[0.98] group"
    >
      <h2 class="text-xl font-bold text-white group-hover:text-[#ff0055] transition-colors duration-200">
        Wallet ID Badge
      </h2>
    </a>

  </div>

  <script>
    let player;
    let hasStarted = false;

    // Load YouTube iframe API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('costcoVideo');
    }

    // Triggered on the very first tap anywhere on the video container
    function startWithSound() {
      if (hasStarted) return;
      hasStarted = true;

      const overlay = document.getElementById('tap-overlay');
      if (overlay) overlay.remove(); // Remove overlay so normal video taps/interactions work

      if (player && player.playVideo) {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    // Inject YouTube Iframe API Script dynamically
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>

</body>
</html>
