<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet ID Badge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .focus-accent:focus {
      border-color: #ff0055 !important;
      box-shadow: 0 0 0 2px rgba(255, 0, 85, 0.2) !important;
    }

    /* --- PAGE TRANSITION & LOADER STYLES --- */
    @keyframes delay {
      0%, 40%, 100% { 
        transform: scaleY(0.05);
      } 
      20% { 
        transform: scaleY(1.0);
      }
    }

    body {
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      height: 50vh;
      width: 100%;
      position: fixed;
      left: 0;
      background: #111111;
      z-index: 100;
      transition: transform 0.3s ease-out;
    }

    body::before {
      top: 0;
      transform: translateY(-100%);
    }

    body::after {
      bottom: 0;
      transform: translateY(100%);
    }

    body.is-changing::before {
      transform: translateY(0%);
    }

    body.is-changing::after {
      transform: translateY(0%);
    }

    .loader {
      margin: 0 auto;
      width: 60px;
      height: 50px;
      text-align: center;
      font-size: 10px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translateY(-50%) translateX(-50%);
      z-index: 101;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    body.is-changing .loader {
      opacity: 1;
    }

    .loader > div {
      height: 100%;
      width: 8px;
      display: inline-block;
      float: left;
      margin-left: 2px;
      animation: delay 0.8s infinite ease-in-out;
      background-color: #ff0055;
    }

    .loader .bar1 { animation-delay: -0.8s; }
    .loader .bar2 { animation-delay: -0.7s; }
    .loader .bar3 { animation-delay: -0.6s; }
    .loader .bar4 { animation-delay: -0.5s; }
    .loader .bar5 { animation-delay: -0.4s; }
    .loader .bar6 { animation-delay: -0.3s; }

    /* --- DROP DOWN ANIMATION FOR BUTTON --- */
    @keyframes dropDown {
      0% {
        opacity: 0;
        transform: translateY(-15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-drop {
      animation: dropDown 0.35s ease-out forwards;
    }
  </style>
</head>
<body class="bg-black text-gray-100 h-[100dvh] flex items-center justify-center p-3 overflow-hidden">

  <!-- Loader Markup -->
  <div class="loader">
    <div class="bar1"></div>
    <div class="bar2"></div>
    <div class="bar3"></div>
    <div class="bar4"></div>
    <div class="bar5"></div>
    <div class="bar6"></div>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-sm bg-black px-4 py-2 rounded-2xl flex flex-col justify-center">
    
    <h1 id="form-title" class="text-4xl font-extrabold text-white text-center mb-6 tracking-tight">
      Wallet ID Badge
    </h1>

    <form id="badgeForm" class="space-y-4">

      <div id="field-name" class="form-field">
        <label for="name" class="block text-sm font-semibold text-white mb-1">
          First & Last Name
        </label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="Mr Bean" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3.5 py-2.5 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <div id="field-employee" class="form-field">
        <label for="employee_id" class="block text-sm font-semibold text-white mb-1">
          Employee Number
        </label>
        <input 
          type="text" 
          inputmode="numeric" 
          pattern="[0-9]*"
          id="employee_id" 
          name="employee_id" 
          placeholder="1234567" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3.5 py-2.5 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <div id="field-phone" class="form-field">
        <label for="phone" class="block text-sm font-semibold text-white mb-1">
          Phone Number
        </label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="(000) 000 - 0000" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-3.5 py-2.5 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        style="background-color: #ff0055;"
        class="w-full text-white font-semibold py-3 px-4 rounded-lg hover:opacity-90 active:scale-[0.99] transition-all duration-200 text-sm shadow-md mt-2 cursor-pointer"
      >
        Submit
      </button>

    </form>

    <!-- Success Text Display -->
    <div id="success_message" class="hidden text-center mt-4 space-y-4">
      <p class="text-xl font-bold text-white tracking-wide">check your text messages</p>
    </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcRk8T4hQ2g-RAeuSRiy4GoNHlbGesJ9sU8jaZCioMnT4ITITdNC6sYM6f-zBGy62B/exec';
    const form = document.getElementById('badgeForm');
    const submitBtn = document.getElementById('submitBtn');
    const formTitle = document.getElementById('form-title');
    const successMsg = document.getElementById('success_message');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // 1. Trigger transition overlay & loader
      document.body.classList.add('is-changing');

      const formData = new FormData(this);

      // Send data to Google Apps Script
      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      })
      .then(() => {
        // Wait 1.5 seconds for the loader animation, then swap views and slide open
        setTimeout(() => {
          formTitle.classList.add('hidden');
          document.querySelectorAll('.form-field').forEach(el => el.classList.add('hidden'));
          
          submitBtn.innerText = 'Done';
          // Keeps original accent color (#ff0055) instead of turning green
          successMsg.classList.remove('hidden');
          
          // Change button behavior to smoothly slide the transition loader again and reset back to the form
          submitBtn.type = 'button';
          submitBtn.onclick = function() {
            document.body.classList.add('is-changing');
            
            setTimeout(() => {
              // Reset form fields and state
              form.reset();
              successMsg.classList.add('hidden');
              formTitle.classList.remove('hidden');
              document.querySelectorAll('.form-field').forEach(el => el.classList.remove('hidden'));
              
              submitBtn.innerText = 'Submit';
              submitBtn.style.backgroundColor = '#ff0055';
              submitBtn.type = 'submit';
              submitBtn.onclick = null;
              
              // Apply drop-down animation as form reappears
              submitBtn.classList.add('animate-drop');
              setTimeout(() => submitBtn.classList.remove('animate-drop'), 400);

              document.body.classList.remove('is-changing');
            }, 600);
          };

          // Remove transition class to slide panels open
          document.body.classList.remove('is-changing');
        }, 1500);
      })
      .catch(error => {
        alert('Submission failed. Please try again.');
        document.body.classList.remove('is-changing');
      });
    });
  </script>

</body>
</html>
