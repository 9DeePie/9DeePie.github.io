<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPC-A Barcode Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f8; }
        .container { background: #ffffff; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; width: 220px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background-color: #2ea44f; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #2c974b; }
        svg { margin-top: 20px; background: #fff; padding: 10px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <div class="container">
        <h2>UPC-A Generator</h2>
        <p>Enter 12 digits:</p>
        
        <input type="text" id="barcodeInput" value="036000291452">
        <button onclick="generateBarcode()">Generate</button>

        <svg id="barcodeElement"></svg>
    </div>

    <!-- Try loading from primary CDN, fallback to secondary CDN automatically -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@11.6.0/dist/JsBarcode.all.min.js" onerror="loadBackupCDN()"></script>

    <script>
        function loadBackupCDN() {
            console.warn("Primary CDN blocked. Loading backup CDN...");
            var script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/11.6.0/JsBarcode.all.min.js";
            script.onload = generateBarcode;
            document.head.appendChild(script);
        }

        function generateBarcode() {
            if (typeof JsBarcode === 'undefined') {
                alert("Barcode library failed to load. Check your internet connection or ad blocker.");
                return;
            }

            let input = document.getElementById('barcodeInput').value.replace(/\D/g, '');
            
            if (input.length === 0) {
                alert("Please enter numbers.");
                return;
            }

            if (input.length < 11) {
                input = input.padStart(12, '0');
            } else if (input.length > 12) {
                input = input.substring(0, 12);
            }

            document.getElementById('barcodeInput').value = input;

            try {
                JsBarcode("#barcodeElement", input, {
                    format: "upc",
                    lineColor: "#000",
                    width: 2,
                    height: 100,
                    displayValue: true
                });
            } catch (error) {
                alert("Generation error: " + error.message);
                console.error(error);
            }
        }

        // Run automatically once window loads
        window.onload = function() {
            setTimeout(generateBarcode, 200); // Small buffer for CDN loading
        };
    </script>

</body>
</html>
