<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet ID Badge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom focus state using accent color #ff0055 */
    .focus-accent:focus {
      border-color: #ff0055 !important;
      box-shadow: 0 0 0 2px rgba(255, 0, 85, 0.2) !important;
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Container -->
  <div class="w-full max-w-md bg-black p-8 rounded-2xl">
    
    <!-- Title -->
    <h1 class="text-2xl font-bold text-white text-center mb-8">
      Wallet ID Badge
    </h1>

    <!-- Hidden Iframe to prevent page redirection on submit -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showConfirmation(); }"></iframe>

    <!-- Form connected directly to your Google Form -->
    <form action="https://docs.google.com/forms/d/e/1FAIpQLSf7OG6lGVgZIpPmp32LjcBqpgI4YRppI1oZ3ZD8TRCZqS0pGg/formResponse" 
          method="POST" 
          target="hidden_iframe" 
          onsubmit="submitted=true;"
          class="space-y-6">

      <!-- Field 1: First & Last Name -->
      <div>
        <label for="name" class="block text-sm font-semibold text-white mb-2">
          First & Last Name
        </label>
        <input 
          type="text" 
          id="name" 
          name="entry.1402365521" 
          placeholder="Mr Bean" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <!-- Field 2: Employee Number -->
      <div>
        <label for="employee_id" class="block text-sm font-semibold text-white mb-2">
          Employee Number
        </label>
        <input 
          type="text" 
          id="employee_id" 
          name="entry.137266959" 
          placeholder="1234567" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <!-- Field 3: Phone Number -->
      <div>
        <label for="phone" class="block text-sm font-semibold text-white mb-2">
          Phone Number
        </label>
        <input 
          type="tel" 
          id="phone" 
          name="entry.986441466" 
          placeholder="(000) 000 - 0000" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        style="background-color: #ff0055;"
        class="w-full text-white font-semibold py-3 px-4 rounded-lg hover:opacity-90 active:scale-[0.99] transition-all duration-200 text-sm shadow-md mt-2"
      >
        Submit
      </button>

    </form>

    <!-- Success Message Box -->
    <div id="success_message" class="hidden mt-6 p-4 rounded-lg bg-neutral-900 border border-neutral-800 text-center">
      <p class="text-sm font-medium text-white">Submitted successfully!</p>
    </div>

  </div>

  <script>
    var submitted = false;
    function showConfirmation() {
      const msg = document.getElementById('success_message');
      msg.classList.remove('hidden');
      document.querySelector('form').reset();
      setTimeout(() => {
        msg.classList.add('hidden');
      }, 4000);
    }
  </script>

</body>
</html>
