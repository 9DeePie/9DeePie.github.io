<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet ID Badge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .focus-accent:focus {
      border-color: #ff0055 !important;
      box-shadow: 0 0 0 2px rgba(255, 0, 85, 0.2) !important;
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-black p-8 rounded-2xl">
    
    <h1 class="text-2xl font-bold text-white text-center mb-8">
      Wallet ID Badge
    </h1>

    <form id="badgeForm" class="space-y-6">

      <div>
        <label for="name" class="block text-sm font-semibold text-white mb-2">
          First & Last Name
        </label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          placeholder="Mr Bean" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <div>
        <label for="employee_id" class="block text-sm font-semibold text-white mb-2">
          Employee Number
        </label>
        <input 
          type="text" 
          inputmode="numeric" 
          pattern="[0-9]*"
          id="employee_id" 
          name="employee_id" 
          placeholder="1234567" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <div>
        <label for="phone" class="block text-sm font-semibold text-white mb-2">
          Phone Number
        </label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="(000) 000 - 0000" 
          required
          class="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-white placeholder-neutral-600 focus:outline-none focus-accent transition-all duration-200 text-sm"
        >
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        style="background-color: #ff0055;"
        class="w-full text-white font-semibold py-3 px-4 rounded-lg hover:opacity-90 active:scale-[0.99] transition-all duration-200 text-sm shadow-md mt-2"
      >
        Submit
      </button>

    </form>

    <div id="success_message" class="hidden mt-6 p-4 rounded-lg bg-neutral-900 border border-neutral-800 text-center">
      <p class="text-sm font-medium text-white">Submitted successfully!</p>
    </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcRk8T4hQ2g-RAeuSRiy4GoNHlbGesJ9sU8jaZCioMnT4ITITdNC6sYM6f-zBGy62B/exec';

    document.getElementById('badgeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('success_message');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const formData = new FormData(this);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors'
      })
      .then(() => {
        successMsg.classList.remove('hidden');
        this.reset();
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit';
        
        setTimeout(() => {
          successMsg.classList.add('hidden');
        }, 4000);
      })
      .catch(error => {
        alert('Submission failed. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit';
      });
    });
  </script>

</body>
</html>
